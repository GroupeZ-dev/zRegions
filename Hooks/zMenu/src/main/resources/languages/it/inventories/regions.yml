# zRegions — elenco delle regioni (richiede zMenu). Estratto in plugins/zRegions/inventories/
# al primo utilizzo; personalizzalo liberamente, poi /rg reload.
name: "&8zRegions &7— Regioni &f%page%&8/&f%max-page%"
size: 54

items:

  regions:
    type: ZREGIONS_REGIONS
    slots:
      - 0-44
    item:
      material: PAPER
      name: "&e%region%"
      lore:
        - "&7Mondo: &f%world%"
        - "&7Forma: &f%shape%"
        - "&7Priorità: &f%priority%"
        - "&7Membri: &f%members%"
        - ""
        - "&8• &eClic &7per gestire"

  previous:
    type: PREVIOUS
    is-permanent: true
    slot: 45
    item:
      material: ARROW
      name: "&7Pagina precedente"

  next:
    type: NEXT
    is-permanent: true
    slot: 53
    item:
      material: ARROW
      name: "&7Pagina successiva"
