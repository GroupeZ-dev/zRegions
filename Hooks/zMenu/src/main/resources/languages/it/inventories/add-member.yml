# zRegions — aggiungi un membro (richiede zMenu). Estratto in plugins/zRegions/inventories/
# al primo utilizzo; personalizzalo liberamente, poi /rg reload.
name: "&8zRegions &7— Aggiungi un membro &f%page%&8/&f%max-page%"
size: 54

items:

  players:
    type: ZREGIONS_ADD_MEMBER
    slots:
      - 0-44
    item:
      material: PLAYER_HEAD
      name: "&a%player%"
      lore:
        - "&8• &eClic &7per aggiungere come membro"

  previous:
    type: PREVIOUS
    is-permanent: true
    slot: 45
    item:
      material: ARROW
      name: "&7Pagina precedente"

  back:
    type: ZREGIONS_OPEN_MEMBERS
    is-permanent: true
    slot: 49
    item:
      material: PLAYER_HEAD
      name: "&7Torna ai membri"

  next:
    type: NEXT
    is-permanent: true
    slot: 53
    item:
      material: ARROW
      name: "&7Pagina successiva"
