# zRegions — menu de gestion d'une région (nécessite zMenu). Extrait dans
# plugins/zRegions/inventories/ à la première utilisation ; personnalisez librement, puis /rg reload.
name: "&8zRegions &7— Région"
size: 27

items:

  info:
    type: ZREGIONS_REGION_INFO
    slot: 4
    item:
      material: FILLED_MAP
      name: "&e%region%"
      lore:
        - "&7Monde : &f%world%"
        - "&7Forme : &f%shape%"
        - "&7Priorité : &f%priority%"
        - "&7Membres : &f%members%"
        - "&7Parent : &f%parent%"

  priority:
    type: ZREGIONS_PRIORITY
    slot: 9
    item:
      material: REPEATER
      name: "&ePriorité : &f%priority%"
      lore:
        - "&8• &aClic gauche &7+1"
        - "&8• &cClic droit &7-1"
        - "&8• &7Shift &8= &7x10"

  flags:
    type: ZREGIONS_OPEN_FLAGS
    slot: 11
    item:
      material: COMPARATOR
      name: "&eFlags"
      lore:
        - "&8• &eClic &7pour éditer les flags"

  members:
    type: ZREGIONS_OPEN_MEMBERS
    slot: 13
    item:
      material: PLAYER_HEAD
      name: "&eMembres"
      lore:
        - "&7Ajouter, retirer, changer les rôles."
        - ""
        - "&8• &eClic &7pour gérer"

  show:
    type: ZREGIONS_SHOW_BORDERS
    slot: 15
    item:
      material: BLAZE_POWDER
      name: "&eAfficher les bordures"
      lore:
        - "&7Contour en particules visible par vous seul."
        - ""
        - "&8• &eClic &7pour afficher"

  back:
    type: ZREGIONS_OPEN_LIST
    slot: 22
    item:
      material: ARROW
      name: "&7Retour à la liste des régions"
