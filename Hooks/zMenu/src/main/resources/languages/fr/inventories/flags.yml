# zRegions — éditeur de flags (nécessite zMenu). Extrait dans plugins/zRegions/inventories/
# à la première utilisation ; personnalisez librement, puis /rg reload.
name: "&8zRegions &7— Flags &f%page%&8/&f%max-page%"
size: 54

items:

  flags:
    type: ZREGIONS_FLAGS
    slots:
      - 0-44
    item:
      material: NAME_TAG
      name: "&e%flag%"
      lore:
        - "&7Valeur : &f%value%"
        - "&7Défaut : &8%default%"
        - ""
        - "&8• &eClic gauche&7 : unset → deny → allow"
        - "&8• &eClic droit&7 : retirer"
        - "&8• &7Flags texte : &f/rg flag"

  previous:
    type: PREVIOUS
    is-permanent: true
    slot: 45
    item:
      material: ARROW
      name: "&7Page précédente"

  back:
    type: ZREGIONS_OPEN_REGION
    is-permanent: true
    slot: 49
    item:
      material: FILLED_MAP
      name: "&7Retour au menu de la région"

  next:
    type: NEXT
    is-permanent: true
    slot: 53
    item:
      material: ARROW
      name: "&7Page suivante"
