# zRegions - configurazione principale
# Documentazione: https://docs.groupez.dev/zregions

# La lingua si sceglie in language.yml (caricato per primo, mai tradotto):
# seleziona i valori predefiniti di config.yml, messages.yml e dei menu.

# Attiva i log dettagliati (utile quando si segnala un problema).
debug: false

# Nodi di permesso. Le modifiche si applicano con /rg reload.
permissions:
  # I giocatori con questo permesso aggirano ogni protezione di regione.
  bypass: zregions.bypass

messages:
  # Ritardo minimo (in millisecondi) tra due messaggi di "negato" inviati allo
  # stesso giocatore, così spingere contro un confine non intasa la chat.
  deny-throttle-milliseconds: 2000

# Comportamento delle regioni.
regions:
  # Se true (predefinito), /rg create aggiunge il creatore come owner della regione.
  # Imposta false affinché le nuove regioni non abbiano owner (gestite solo da
  # un admin, zregions.admin).
  creator-becomes-owner: true

# Strumento di selezione.
selection:
  # Material di Bukkit della bacchetta data da /rg wand (clic sinistro = pos1, clic destro = pos2).
  wand-item: BLAZE_ROD

# Contorno mostrato da /rg show (particelle visibili solo a quel giocatore).
borders:
  # Particella di Bukkit usata per il contorno (FLAME, END_ROD, HAPPY_VILLAGER, ...).
  particle: FLAME
  # Per quanto tempo il contorno resta visibile, in secondi.
  display-seconds: 10
  # Periodo di aggiornamento delle particelle, in millisecondi.
  refresh-milliseconds: 500
  # Distanza tra due particelle lungo gli spigoli, in blocchi.
  point-spacing: 0.5
  # Limite di particelle per aggiornamento — le regioni enormi hanno un contorno
  # più rado.
  max-points: 1500

# Supporto multi-server (rete). Il livello di messaging arriva nella v2, ma il
# modello dei dati è pronto per la rete fin dalla v1: ogni regione è marcata
# con il nome di questo server.
multi-server:
  # Imposta true quando più server condividono lo stesso database MySQL/MariaDB.
  enabled: false
  # Il nome logico di QUESTO server sulla rete ("global" = server singolo).
  server: global

# Archiviazione delle regioni.
storage:
  # SQLITE (file locale, predefinito) o MYSQL / MARIADB (richiesto in multi-server).
  type: SQLITE
  # Prefisso applicato a tutte le tabelle di zRegions.
  table-prefix: zregions_
  # Credenziali, usate solo per MYSQL / MARIADB.
  database:
    host: 127.0.0.1
    port: 3306
    database: zregions
    user: root
    password: ""
