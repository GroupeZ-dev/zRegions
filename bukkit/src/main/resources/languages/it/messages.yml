# zRegions - Messaggi in italiano (formato MiniMessage)
# I tag come <region> o <position> vengono sostituiti dal plugin.

prefix: '<dark_gray>[<gradient:#38bdf8:#2563eb>zRegions</gradient><dark_gray>]<reset> '

commands:
  player-only: '<prefix><red>Questo comando può essere usato solo da un giocatore.'
  no-permission: '<prefix><red>Non hai il permesso di farlo.'
  unknown: '<prefix><red>Sottocomando sconosciuto. Usa <yellow>/rg help</yellow>.'
  player-not-found: '<prefix><red>Giocatore <yellow><player></yellow> sconosciuto.'
  reloaded: '<prefix><green>Configurazione e messaggi ricaricati.'
  help:
    header: '<prefix><gray>Comandi disponibili:'
    entry: '<gray> • <yellow>/rg <usage></yellow> <dark_gray>- <gray><description>'
  descriptions:
    help: 'Mostra questo aiuto'
    wand: 'Dà la bacchetta di selezione (clic sinistro = pos1, clic destro = pos2)'
    pos1: 'Imposta il primo angolo della selezione'
    pos2: 'Imposta il secondo angolo della selezione'
    addpoint: 'Aggiunge un vertice del poligono alla tua posizione'
    clearpoints: 'Cancella i vertici del poligono'
    star: 'Genera il contorno di una stella intorno a te (concludi con la forma polygon)'
    create: 'Crea una regione dalla tua selezione (cuboide, cilindro, sfera o poligono)'
    remove: 'Elimina una regione'
    list: 'Elenca le regioni di un mondo'
    info: 'Mostra i dettagli di una regione'
    show: 'Mostra i confini di una regione con particelle (solo tu le vedi)'
    flag: 'Imposta, rimuove o indirizza un flag di regione'
    addmember: 'Aggiunge un proprietario o membro a una regione'
    removemember: 'Rimuove un membro da una regione'
    setpriority: 'Cambia la priorità di una regione'
    setparent: 'Imposta o rimuove la regione padre'
    redefine: 'Sostituisce la forma di una regione con la tua selezione'
    reload: 'Ricarica la configurazione e i messaggi'

selection:
  pos1: '<prefix><gray>Posizione <yellow>1</yellow> impostata su <yellow><position></yellow>.'
  pos2: '<prefix><gray>Posizione <yellow>2</yellow> impostata su <yellow><position></yellow>.'
  incomplete: '<prefix><red>Seleziona prima due posizioni (<yellow>/rg pos1</yellow> e <yellow>/rg pos2</yellow>).'
  world-mismatch: '<prefix><red>L''intera selezione deve trovarsi nello stesso mondo.'
  radius-too-small: '<prefix><red>Le posizioni 1 e 2 sono troppo vicine — il raggio deve essere di almeno <yellow>1</yellow> blocco.'
  points-needed: '<prefix><red>Un poligono richiede almeno <yellow>3</yellow> punti (<yellow>/rg addpoint</yellow> o <yellow>/rg star</yellow>).'
  point-added: '<prefix><gray>Punto <yellow>#<count></yellow> aggiunto in <yellow><position></yellow>.'
  points-cleared: '<prefix><gray>Punti del poligono cancellati.'
  star-generated: '<prefix><green>Stella con <yellow><branches></yellow> punte generata (<yellow><points></yellow> punti) intorno a te. Imposta l''altezza con <yellow>/rg pos1</yellow>/<yellow>pos2</yellow>, poi crea con la forma <yellow>polygon</yellow>.'
  wand:
    name: '<gold>Bacchetta zRegions'
    given: '<prefix><green>Bacchetta ricevuta: <yellow>clic sinistro</yellow> = posizione 1, <yellow>clic destro</yellow> = posizione 2.'

region:
  created: '<prefix><green>Regione <yellow><region></yellow> creata (<gray><shape></gray>, priorità <gray><priority></gray>).'
  already-exists: '<prefix><red>Una regione chiamata <yellow><region></yellow> esiste già in questo mondo.'
  not-found: '<prefix><red>Nessuna regione chiamata <yellow><region></yellow> è stata trovata.'
  ambiguous: '<prefix><red>Esistono più regioni chiamate <yellow><region></yellow> (mondi: <yellow><worlds></yellow>). Usa <yellow>mondo:<region></yellow>.'
  removed: '<prefix><green>Regione <yellow><region></yellow> rimossa.'
  priority-set: '<prefix><green>Priorità di <yellow><region></yellow> impostata su <yellow><priority></yellow>.'
  parent-set: '<prefix><green>La regione <yellow><region></yellow> ora eredita da <yellow><parent></yellow>.'
  parent-cleared: '<prefix><green>La regione <yellow><region></yellow> non ha più una regione padre.'
  parent-cycle: '<prefix><red>Impossibile: questo creerebbe un ciclo di ereditarietà.'
  redefined: '<prefix><green>Regione <yellow><region></yellow> ridefinita dalla tua selezione.'
  redefine-global: '<prefix><red>La regione globale non ha una forma da ridefinire.'
  redefine-world-mismatch: '<prefix><red>La tua selezione è in <yellow><world></yellow> ma la regione si trova in <yellow><region_world></yellow>.'
  list:
    header: '<prefix><gray>Regioni in <yellow><world></yellow> (<count>):'
    entry: '<gray> • <yellow><region></yellow> <dark_gray>(<gray><shape></gray>, priorità <gray><priority></gray><dark_gray>)'
    empty: '<prefix><gray>Nessuna regione in questo mondo per ora.'
  info:
    header: '<prefix><gray>Regione <yellow><region></yellow>:'
    world: '<gray> Mondo: <yellow><world></yellow>'
    shape: '<gray> Forma: <yellow><shape></yellow>'
    priority: '<gray> Priorità: <yellow><priority></yellow>'
    members: '<gray> Membri: <yellow><members></yellow>'
    flags: '<gray> Flag: <yellow><flags></yellow>'

member:
  added: '<prefix><green><player> è ora <yellow><role></yellow> di <yellow><region></yellow>.'
  removed: '<prefix><green><player> rimosso da <yellow><region></yellow>.'
  not-member: '<prefix><red><player> non è membro di <yellow><region></yellow>.'
  invalid-role: '<prefix><red>Ruolo <yellow><role></yellow> sconosciuto. Usa <yellow>owner</yellow> o <yellow>member</yellow>.'

flag:
  set: '<prefix><green>Flag <yellow><flag></yellow> impostato su <yellow><value></yellow> per <yellow><target></yellow> in <yellow><region></yellow>.'
  unset: '<prefix><green>Flag <yellow><flag></yellow> rimosso per <yellow><target></yellow> in <yellow><region></yellow>.'
  unknown: '<prefix><red>Flag <yellow><flag></yellow> sconosciuto.'
  invalid-value: '<prefix><red>Valore <yellow><value></yellow> non valido per il flag <yellow><flag></yellow>.'
  invalid-target: '<prefix><red>Bersaglio <yellow><target></yellow> sconosciuto. Usa <yellow>owner</yellow>, <yellow>member</yellow>, <yellow>visitor</yellow> o <yellow>all</yellow>.'

border:
  shown: '<prefix><green>Confini di <yellow><region></yellow> mostrati per <yellow><seconds></yellow>s (solo tu puoi vederli).'
  global: '<prefix><red>La regione globale copre il mondo intero — non c''è nulla da delimitare.'
  other-world: '<prefix><red>La regione <yellow><region></yellow> è in <yellow><region_world></yellow>, tu sei in <yellow><world></yellow>.'

protection:
  denied: '<prefix><red>Non puoi farlo qui.'
  entry-denied: '<prefix><red>Non puoi entrare in <yellow><region></yellow>.'
  exit-denied: '<prefix><red>Non puoi uscire da <yellow><region></yellow>.'
