# zRegions - configuración principal
# Documentación: https://docs.groupez.dev/zregions

# El idioma se elige en language.yml (cargado primero, nunca traducido):
# selecciona los valores por defecto de config.yml, messages.yml y los menús.

# Activa los registros detallados (útil al reportar un problema).
debug: false

# Nodos de permiso. Los cambios se aplican con /rg reload.
permissions:
  # Los jugadores con este permiso eluden toda protección de región.
  bypass: zregions.bypass

messages:
  # Retraso mínimo (en milisegundos) entre dos mensajes de "denegado" enviados
  # al mismo jugador, para que empujar contra un borde no inunde el chat.
  deny-throttle-milliseconds: 2000

# Comportamiento de las regiones.
regions:
  # Si es true (por defecto), /rg create añade al creador como owner de la región.
  # Ponlo en false para que las regiones nuevas no tengan owner (gestionadas
  # solo por un admin, zregions.admin).
  creator-becomes-owner: true

# Herramienta de selección.
selection:
  # Material de Bukkit de la varita dada por /rg wand (clic izquierdo = pos1, clic derecho = pos2).
  wand-item: BLAZE_ROD

# Contorno mostrado por /rg show (partículas visibles solo para ese jugador).
borders:
  # Partícula de Bukkit usada para el contorno (FLAME, END_ROD, HAPPY_VILLAGER, ...).
  particle: FLAME
  # Cuánto tiempo permanece visible el contorno, en segundos.
  display-seconds: 10
  # Período de refresco de las partículas, en milisegundos.
  refresh-milliseconds: 500
  # Distancia entre dos partículas a lo largo de las aristas, en bloques.
  point-spacing: 0.5
  # Límite de partículas por refresco — las regiones enormes tienen un contorno
  # más disperso.
  max-points: 1500

# Soporte multi-servidor (red). La capa de mensajería llega en la v2, pero el
# modelo de datos está listo para red desde la v1: cada región queda marcada
# con el nombre de este servidor.
multi-server:
  # Cambia a true cuando varios servidores comparten la misma base MySQL/MariaDB.
  enabled: false
  # El nombre lógico de ESTE servidor en la red ("global" = un solo servidor).
  server: global

# Almacenamiento de las regiones.
storage:
  # SQLITE (archivo local, por defecto) o MYSQL / MARIADB (requerido en multi-servidor).
  type: SQLITE
  # Prefijo aplicado a todas las tablas de zRegions.
  table-prefix: zregions_
  # Credenciales, usadas solo para MYSQL / MARIADB.
  database:
    host: 127.0.0.1
    port: 3306
    database: zregions
    user: root
    password: ""
