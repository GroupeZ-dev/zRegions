  world-mismatch: '<prefix><red>Les deux positions doivent être dans le même monde.'

region:
  created: '<prefix><green>Région <yellow><region></yellow> créée (<gray><shape></gray>, priorité <gray><priority></gray>).'
  already-exists: '<prefix><red>Une région nommée <yellow><region></yellow> existe déjà dans ce monde.'
  not-found: '<prefix><red>Aucune région nommée <yellow><region></yellow> n''a été trouvée.'
  ambiguous: '<prefix><red>Plusieurs régions se nomment <yellow><region></yellow> (mondes : <yellow><worlds></yellow>). Utilisez <yellow>monde:<region></yellow>.'
  removed: '<prefix><green>Région <yellow><region></yellow> supprimée.'
  priority-set: '<prefix><green>Priorité de <yellow><region></yellow> définie sur <yellow><priority></yellow>.'
  parent-set: '<prefix><green>La région <yellow><region></yellow> hérite désormais de <yellow><parent></yellow>.'
  parent-cleared: '<prefix><green>La région <yellow><region></yellow> n''a plus de parent.'
  parent-cycle: '<prefix><red>Impossible : cela créerait un cycle d''héritage.'
  redefined: '<prefix><green>Région <yellow><region></yellow> redéfinie à partir de votre sélection.'
  redefine-global: '<prefix><red>La région globale n''a pas de forme à redéfinir.'
  redefine-world-mismatch: '<prefix><red>Votre sélection est dans <yellow><world></yellow> mais la région se trouve dans <yellow><region_world></yellow>.'
  list:
    header: '<prefix><gray>Régions dans <yellow><world></yellow> (<count>) :'
    entry: '<gray> • <yellow><region></yellow> <dark_gray>(<gray><shape></gray>, priorité <gray><priority></gray><dark_gray>)'
    empty: '<prefix><gray>Aucune région dans ce monde pour le moment.'
  info:
    header: '<prefix><gray>Région <yellow><region></yellow> :'
    world: '<gray> Monde : <yellow><world></yellow>'
    shape: '<gray> Forme : <yellow><shape></yellow>'
    priority: '<gray> Priorité : <yellow><priority></yellow>'
    members: '<gray> Membres : <yellow><members></yellow>'
    flags: '<gray> Flags : <yellow><flags></yellow>'

member:
  added: '<prefix><green><player> est désormais <yellow><role></yellow> de <yellow><region></yellow>.'
  removed: '<prefix><green><player> retiré de <yellow><region></yellow>.'
  not-member: '<prefix><red><player> n''est pas membre de <yellow><region></yellow>.'
  invalid-role: '<prefix><red>Rôle <yellow><role></yellow> inconnu. Utilisez <yellow>owner</yellow> ou <yellow>member</yellow>.'

flag:
  set: '<prefix><green>Flag <yellow><flag></yellow> défini sur <yellow><value></yellow> pour <yellow><target></yellow> dans <yellow><region></yellow>.'
  unset: '<prefix><green>Flag <yellow><flag></yellow> retiré pour <yellow><target></yellow> dans <yellow><region></yellow>.'
  unknown: '<prefix><red>Flag <yellow><flag></yellow> inconnu.'
  invalid-value: '<prefix><red>Valeur <yellow><value></yellow> invalide pour le flag <yellow><flag></yellow>.'
  invalid-target: '<prefix><red>Cible <yellow><target></yellow> inconnue. Utilisez <yellow>owner</yellow>, <yellow>member</yellow>, <yellow>visitor</yellow> ou <yellow>all</yellow>.'

protection:
  denied: '<prefix><red>Vous ne pouvez pas faire cela ici.'
  entry-denied: '<prefix><red>Vous ne pouvez pas entrer dans <yellow><region></yellow>.'
  exit-denied: '<prefix><red>Vous ne pouvez pas quitter <yellow><region></yellow>.'
