# zRegions - Messages français (format MiniMessage)
# Les balises comme <region> ou <position> sont remplacées par le plugin.

prefix: '<dark_gray>[<gradient:#38bdf8:#2563eb>zRegions</gradient><dark_gray>]<reset> '

commands:
  player-only: '<prefix><red>Cette commande ne peut être utilisée que par un joueur.'
  no-permission: '<prefix><red>Vous n''avez pas la permission de faire cela.'
  unknown: '<prefix><red>Sous-commande inconnue. Utilisez <yellow>/rg help</yellow>.'
  player-not-found: '<prefix><red>Joueur <yellow><player></yellow> introuvable.'
  reloaded: '<prefix><green>Configuration et messages rechargés.'
  help:
    header: '<prefix><gray>Commandes disponibles :'
    entry: '<gray> • <yellow>/rg <usage></yellow> <dark_gray>- <gray><description>'
  descriptions:
    help: 'Affiche cette aide'
    wand: 'Donne la baguette de sélection (clic gauche = pos1, clic droit = pos2)'
    pos1: 'Définit le premier coin de la sélection'
    pos2: 'Définit le second coin de la sélection'
    addpoint: 'Ajoute un sommet du polygone à votre position'
    clearpoints: 'Efface les sommets du polygone'
    star: 'Génère le contour d''une étoile autour de vous (terminez avec la forme polygon)'
    create: 'Crée une région à partir de votre sélection (cuboïde, cylindre, sphère ou polygone)'
    global: 'Crée la région globale d''un monde'
    remove: 'Supprime une région'
    list: 'Liste les régions d''un monde'
    info: 'Affiche les détails d''une région'
    show: 'Affiche les bordures d''une région en particules (visibles par vous seul)'
    flag: 'Définit, retire ou cible un flag de région'
    addmember: 'Ajoute un propriétaire ou un membre à une région'
    removemember: 'Retire un membre d''une région'
    setpriority: 'Change la priorité d''une région'
    setparent: 'Définit ou retire le parent d''une région'
    redefine: 'Remplace la forme d''une région par votre sélection'
    reload: 'Recharge la configuration et les messages'

selection:
  pos1: '<prefix><gray>Position <yellow>1</yellow> définie sur <yellow><position></yellow>.'
  pos2: '<prefix><gray>Position <yellow>2</yellow> définie sur <yellow><position></yellow>.'
  incomplete: '<prefix><red>Sélectionnez d''abord deux positions (<yellow>/rg pos1</yellow> et <yellow>/rg pos2</yellow>).'
  world-mismatch: '<prefix><red>Toute la sélection doit être dans le même monde.'
  radius-too-small: '<prefix><red>Les positions 1 et 2 sont trop proches — le rayon doit être d''au moins <yellow>1</yellow> bloc.'
  points-needed: '<prefix><red>Un polygone nécessite au moins <yellow>3</yellow> points (<yellow>/rg addpoint</yellow> ou <yellow>/rg star</yellow>).'
  point-added: '<prefix><gray>Point <yellow>#<count></yellow> ajouté en <yellow><position></yellow>.'
  points-cleared: '<prefix><gray>Points du polygone effacés.'
  star-generated: '<prefix><green>Étoile à <yellow><branches></yellow> branches générée (<yellow><points></yellow> points) autour de vous. Définissez la hauteur avec <yellow>/rg pos1</yellow>/<yellow>pos2</yellow>, puis créez avec la forme <yellow>polygon</yellow>.'
  wand:
    name: '<gold>Baguette zRegions'
    given: '<prefix><green>Baguette reçue : <yellow>clic gauche</yellow> = position 1, <yellow>clic droit</yellow> = position 2.'

region:
  created: '<prefix><green>Région <yellow><region></yellow> créée (<gray><shape></gray>, priorité <gray><priority></gray>).'
  already-exists: '<prefix><red>Une région nommée <yellow><region></yellow> existe déjà dans ce monde.'
  name-reserved: '<prefix><red>Le nom <yellow><region></yellow> est réservé. Utilisez <yellow>/rg global</yellow> pour créer la région globale.'
  global-created: '<prefix><green>Région globale <yellow><region></yellow> créée pour le monde <yellow><world></yellow> — ses flags s''appliquent désormais partout où aucune région ne les surcharge.'
  global-exists: '<prefix><gray>Le monde <yellow><world></yellow> possède déjà sa région globale (<yellow><region></yellow>).'
  not-found: '<prefix><red>Aucune région nommée <yellow><region></yellow> n''a été trouvée.'
  ambiguous: '<prefix><red>Plusieurs régions se nomment <yellow><region></yellow> (mondes : <yellow><worlds></yellow>). Utilisez <yellow>monde:<region></yellow>.'
  removed: '<prefix><green>Région <yellow><region></yellow> supprimée.'
  priority-set: '<prefix><green>Priorité de <yellow><region></yellow> définie sur <yellow><priority></yellow>.'
  parent-set: '<prefix><green>La région <yellow><region></yellow> hérite désormais de <yellow><parent></yellow>.'
  parent-cleared: '<prefix><green>La région <yellow><region></yellow> n''a plus de parent.'
  parent-cycle: '<prefix><red>Impossible : cela créerait un cycle d''héritage.'
  redefined: '<prefix><green>Région <yellow><region></yellow> redéfinie à partir de votre sélection.'
  redefine-global: '<prefix><red>La région globale n''a pas de forme à redéfinir.'
  redefine-world-mismatch: '<prefix><red>Votre sélection est dans <yellow><world></yellow> mais la région se trouve dans <yellow><region_world></yellow>.'
  list:
    header: '<prefix><gray>Régions dans <yellow><world></yellow> (<count>) :'
    entry: '<gray> • <yellow><region></yellow> <dark_gray>(<gray><shape></gray>, priorité <gray><priority></gray><dark_gray>)'
    empty: '<prefix><gray>Aucune région dans ce monde pour le moment.'
  info:
    header: '<prefix><gray>Région <yellow><region></yellow> :'
    world: '<gray> Monde : <yellow><world></yellow>'
    shape: '<gray> Forme : <yellow><shape></yellow>'
    priority: '<gray> Priorité : <yellow><priority></yellow>'
    members: '<gray> Membres : <yellow><members></yellow>'
    flags: '<gray> Flags : <yellow><flags></yellow>'

member:
  added: '<prefix><green><player> est désormais <yellow><role></yellow> de <yellow><region></yellow>.'
  removed: '<prefix><green><player> retiré de <yellow><region></yellow>.'
  not-member: '<prefix><red><player> n''est pas membre de <yellow><region></yellow>.'
  invalid-role: '<prefix><red>Rôle <yellow><role></yellow> inconnu. Utilisez <yellow>owner</yellow> ou <yellow>member</yellow>.'

flag:
  set: '<prefix><green>Flag <yellow><flag></yellow> défini sur <yellow><value></yellow> pour <yellow><target></yellow> dans <yellow><region></yellow>.'
  unset: '<prefix><green>Flag <yellow><flag></yellow> retiré pour <yellow><target></yellow> dans <yellow><region></yellow>.'
  unknown: '<prefix><red>Flag <yellow><flag></yellow> inconnu.'
  invalid-value: '<prefix><red>Valeur <yellow><value></yellow> invalide pour le flag <yellow><flag></yellow>.'
  invalid-target: '<prefix><red>Cible <yellow><target></yellow> inconnue. Utilisez <yellow>owner</yellow>, <yellow>member</yellow>, <yellow>visitor</yellow> ou <yellow>all</yellow>.'

border:
