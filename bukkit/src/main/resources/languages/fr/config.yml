# zRegions - configuration principale
# Documentation : https://docs.groupez.dev/zregions

# La langue se choisit dans language.yml (chargé en premier, jamais traduit) :
# il sélectionne les défauts embarqués de config.yml, messages.yml et des menus.

# Active les logs détaillés (utile pour signaler un problème).
debug: false

# Nœuds de permission. Changement pris en compte au /rg reload.
permissions:
  # Les joueurs possédant cette permission contournent toute protection de région.
  bypass: zregions.bypass

messages:
  # Délai minimum (en millisecondes) entre deux messages « refusé » envoyés au
  # même joueur, pour que pousser contre une bordure ne spamme pas le chat.
  deny-throttle-milliseconds: 2000

# Outil de sélection.
selection:
  # Material Bukkit de la baguette donnée par /rg wand (clic gauche = pos1, clic droit = pos2).
  wand-item: BLAZE_ROD

# Contour affiché par /rg show (particules visibles uniquement par ce joueur).
borders:
  # Particule Bukkit utilisée pour le contour (FLAME, END_ROD, HAPPY_VILLAGER, ...).
  particle: FLAME
  # Durée d'affichage du contour, en secondes.
  display-seconds: 10
  # Période de rafraîchissement des particules, en millisecondes.
  refresh-milliseconds: 500
  # Distance entre deux particules le long des arêtes, en blocs.
  point-spacing: 0.5
  # Plafond de particules par rafraîchissement — les régions immenses ont un
  # contour plus clairsemé.
  max-points: 1500

# Support multi-serveur (réseau). La couche de messaging arrive en v2, mais le
# modèle de données est prêt réseau dès la v1 : chaque région est estampillée
# du nom de ce serveur.
multi-server:
  # Passez à true quand plusieurs serveurs partagent la même base MySQL/MariaDB.
  enabled: false
  # Le nom logique de CE serveur sur le réseau ("global" = mono-serveur).
  server: global

# Stockage des régions.
storage:
  # SQLITE (fichier local, défaut) ou MYSQL / MARIADB (requis en multi-serveur).
  type: SQLITE
  # Préfixe appliqué à toutes les tables zRegions.
  table-prefix: zregions_
  # Identifiants, utilisés uniquement pour MYSQL / MARIADB.
  database:
    host: 127.0.0.1
    port: 3306
    database: zregions
    user: root
    password: ""
