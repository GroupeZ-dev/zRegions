# zRegions - English messages (MiniMessage format)
# Placeholders like <region> or <position> are replaced by the plugin.

prefix: '<muted>[<gradient:#38bdf8:#2563eb>zRegions</gradient><muted>]<reset> '

commands:
  player-only: '<prefix><error>This command can only be used by a player.'
  no-permission: '<prefix><error>You don''t have permission to do this.'
  unknown: '<prefix><error>Unknown sub-command. Use <accent>/rg help</accent>.'
  player-not-found: '<prefix><error>Unknown player <accent><player></accent>.'
  reloaded: '<prefix><success>Configuration and messages reloaded.'
  page: '<muted>Page <body><page></body><muted>/<body><pages></body>'
  help:
    header: '<prefix><primary>Available commands:'
    entry: '<body> • <accent>/rg <usage></accent> <muted>- <body><description>'
    hover: '<body>Click to insert this command.'
  descriptions:
    help: 'Shows this help'
    wand: 'Gives the selection wand (left click = pos1, right click = pos2)'
    pos1: 'Sets the first selection corner'
    pos2: 'Sets the second selection corner'
    addpoint: 'Adds a polygon vertex at your position'
    clearpoints: 'Clears the polygon vertices'
    star: 'Generates a star outline around you (finish with the polygon shape)'
    create: 'Creates a region from your selection (cuboid, cylinder, sphere or polygon)'
    global: 'Creates the world-wide global region of a world'
    remove: 'Deletes a region'
    list: 'Lists the regions of a world'
    info: 'Shows the details of a region'
    menu: 'Opens the region GUI (requires zMenu)'
    show: 'Outlines the borders of a region with particles (only you see them)'
    teleport: 'Teleports you to a region (alias: tp)'
    flag: 'Sets, unsets or targets a region flag'
    flags: 'Lists every flag with its description'
    addmember: 'Adds an owner or member to a region'
    removemember: 'Removes a member from a region'
    setpriority: 'Changes the priority of a region'
    setparent: 'Sets or clears the parent of a region'
    redefine: 'Replaces the shape of a region with your selection'
    import: 'Imports regions from another protection plugin (WorldGuard)'
    reload: 'Reloads the configuration and messages'

selection:
  pos1: '<prefix><body>Position <accent>1</accent> set to <accent><position></accent>.'
  pos2: '<prefix><body>Position <accent>2</accent> set to <accent><position></accent>.'
  incomplete: '<prefix><error>Select two positions first (<accent>/rg pos1</accent> and <accent>/rg pos2</accent>).'
  world-mismatch: '<prefix><error>The whole selection must be in the same world.'
  radius-too-small: '<prefix><error>Positions 1 and 2 are too close — the radius must be at least <accent>1</accent> block.'
  points-needed: '<prefix><error>A polygon needs at least <accent>3</accent> points (<accent>/rg addpoint</accent> or <accent>/rg star</accent>).'
  point-added: '<prefix><body>Point <accent>#<count></accent> added at <accent><position></accent>.'
  points-cleared: '<prefix><body>Polygon points cleared.'
  star-generated: '<prefix><success>Star with <accent><branches></accent> branches generated (<accent><points></accent> points) around you. Set the height with <accent>/rg pos1</accent>/<accent>pos2</accent>, then create with the <accent>polygon</accent> shape.'
  wand:
    name: '<accent>zRegions wand'
    given: '<prefix><success>Wand received: <accent>left click</accent> = position 1, <accent>right click</accent> = position 2.'

region:
  created: '<prefix><success>Region <accent><region></accent> created (<body><shape></body>, priority <body><priority></body>).'
  already-exists: '<prefix><error>A region named <accent><region></accent> already exists in this world.'
  name-reserved: '<prefix><error>The name <accent><region></accent> is reserved. Use <accent>/rg global</accent> to create the global region.'
  global-created: '<prefix><success>Global region <accent><region></accent> created for world <accent><world></accent> — its flags now apply wherever no region overrides them.'
  global-exists: '<prefix><body>World <accent><world></accent> already has its global region (<accent><region></accent>).'
  not-found: '<prefix><error>No region named <accent><region></accent> was found.'
  ambiguous: '<prefix><error>Several regions are named <accent><region></accent> (worlds: <accent><worlds></accent>). Use <accent>world:<region></accent>.'
  removed: '<prefix><success>Region <accent><region></accent> removed.'
  teleported: '<prefix><success>Teleported to <accent><region></accent>.'
  remove-confirm: '<prefix><body>Delete region <accent><region></accent>? <error>This cannot be undone.</error> '
  remove-confirm-button: '<success>[✔ Confirm]'
  remove-confirm-hover: '<body>Click to permanently delete this region.'
  remove-confirm-hint: '<muted> — or ignore this message.'
  teleport-global: '<prefix><error>The global region covers the whole world — there is nowhere specific to teleport to.'
  teleport-no-safe: '<prefix><error>No safe spot found to teleport into <accent><region></accent>.'
  priority-set: '<prefix><success>Priority of <accent><region></accent> set to <accent><priority></accent>.'
  parent-set: '<prefix><success>Region <accent><region></accent> now inherits from <accent><parent></accent>.'
  parent-cleared: '<prefix><success>Region <accent><region></accent> no longer has a parent.'
  parent-cycle: '<prefix><error>Impossible: this would create an inheritance cycle.'
  redefined: '<prefix><success>Region <accent><region></accent> redefined from your selection.'
  redefine-global: '<prefix><error>The global region has no shape to redefine.'
  redefine-world-mismatch: '<prefix><error>Your selection is in <accent><world></accent> but the region lives in <accent><region_world></accent>.'
  list:
    header: '<prefix><primary>Regions in <accent><world></accent> (<count>):'
    entry: '<body> • <accent><region></accent> <muted>(<body><shape></body>, priority <body><priority></body><muted>)'
    hover: '<body>Click for the region details.'
    empty: '<prefix><body>No region in this world yet.'
  info:
    header: '<prefix><primary>Region <accent><region></accent>:'
    world: '<body> World: <accent><world></accent>'
    shape: '<body> Shape: <accent><shape></accent>'
    priority: '<body> Priority: <accent><priority></accent>'
    members: '<body> Members: <accent><members></accent>'
    flags: '<body> Flags: <accent><flags></accent>'

member:
  added: '<prefix><success><player> is now <accent><role></accent> of <accent><region></accent>.'
  removed: '<prefix><success><player> removed from <accent><region></accent>.'
  not-member: '<prefix><error><player> is not a member of <accent><region></accent>.'
  invalid-role: '<prefix><error>Unknown role <accent><role></accent>. Use <accent>owner</accent> or <accent>member</accent>.'

flag:
  set: '<prefix><success>Flag <accent><flag></accent> set to <accent><value></accent> for <accent><target></accent> in <accent><region></accent>.'
  unset: '<prefix><success>Flag <accent><flag></accent> removed for <accent><target></accent> in <accent><region></accent>.'
  unknown: '<prefix><error>Unknown flag <accent><flag></accent>.'
  invalid-value: '<prefix><error>Invalid value <accent><value></accent> for flag <accent><flag></accent>.'
  invalid-target: '<prefix><error>Unknown target <accent><target></accent>. Use <accent>owner</accent>, <accent>member</accent>, <accent>visitor</accent> or <accent>all</accent>.'
  list:
    header: '<prefix><primary>Flag catalogue <muted>(<count>)<primary>:'
    entry: '<muted> • <accent><flag></accent> <muted>— <body><type>'
    hover: '<accent><flag></accent><newline><body><description><newline><muted>Click to start a /rg flag command.'

gui:
  unavailable: '<prefix><error>The GUI requires the <accent>zMenu</accent> plugin. Everything stays available through commands — see <accent>/rg help</accent>.'
  region-gone: '<prefix><error>This region no longer exists.'
  flag-command-only: '<prefix><body>Flag <accent><flag></accent> holds a value — set it with <accent>/rg flag <region> <flag> …</accent>.'

border:
  shown: '<prefix><success>Showing the borders of <accent><region></accent> for <accent><seconds></accent>s (only you can see them).'
  global: '<prefix><error>The global region covers the whole world — there is nothing to outline.'
  other-world: '<prefix><error>Region <accent><region></accent> is in <accent><region_world></accent>, you are in <accent><world></accent>.'

import:
  unknown-source: '<prefix><error>Unknown import source <accent><source></accent>. Available: <accent><sources></accent>.'
  source-not-found: '<prefix><error>No <source> data found (<accent><path></accent>).'
  started: '<prefix><body>Importing <accent><source></accent> regions…'
  done: '<prefix><success>Import finished: <accent><imported></accent> region(s) imported, <accent><skipped></accent> skipped, <accent><flags></accent> flag value(s), <accent><members></accent> member(s). Details in the server console.'
  dry-run: '<prefix><body>Dry-run only — nothing was written. Run without <accent>--dry-run</accent> to apply.'

protection:
  denied: '<prefix><error>You can''t do that here.'
  entry-denied: '<prefix><error>You can''t enter <accent><region></accent>.'
  exit-denied: '<prefix><error>You can''t leave <accent><region></accent>.'

# Flag descriptions (shown in /rg flags hover and the zMenu flag editor). Plain text.
flags:
  block-break: 'Prevents breaking blocks.'
  block-place: 'Prevents placing blocks.'
  interact: 'Prevents right-clicking non-container blocks like doors, buttons and levers.'
  container-access: 'Prevents opening containers such as chests, furnaces and barrels.'
  bucket-fill: 'Prevents scooping fluids with a bucket.'
  bucket-empty: 'Prevents emptying buckets to place fluids.'
  armor-stand: 'Prevents manipulating or breaking armor stands.'
  hanging-break: 'Prevents breaking item frames and paintings.'
  hanging-place: 'Prevents placing item frames and paintings.'
  vehicle-place: 'Prevents placing boats and minecarts.'
  vehicle-destroy: 'Prevents destroying boats and minecarts.'
  crop-trample: 'Prevents trampling farmland and turtle eggs.'
  redstone: 'Prevents redstone current changes inside the region.'
  piston: 'Prevents pistons extending or retracting into the region.'
  fire-ignite: 'Prevents players igniting fire with flint and steel.'
  fire-spread: 'Prevents fire spreading, blocks burning and non-player ignitions.'
  fluid-flow: 'Prevents water and lava flowing into the region.'
  leaf-decay: 'Prevents natural leaf decay.'
  block-explosion: 'Prevents block damage from block-based explosions like beds and anchors.'
  entity-explosion: 'Prevents block damage from entity explosions like creepers and TNT.'
  mob-spawning: 'Prevents natural mob spawns inside the region.'
  mob-griefing: 'Prevents mobs altering blocks or trampling crops and turtle eggs.'
  damage-animals: 'Prevents players damaging animals.'
  mob-damage: 'Prevents mobs and other entities damaging players.'
  pvp: 'Prevents player-vs-player combat, projectiles included.'
  invincible: 'Makes players inside immune to all damage.'
  fall-damage: 'Prevents fall damage inside the region.'
  hunger: 'Freezes hunger loss inside the region.'
  item-drop: 'Prevents dropping items.'
  item-pickup: 'Prevents picking up items.'
  enderpearl: 'Prevents teleporting into the region with ender pearls.'
  chorus-fruit: 'Prevents teleporting into the region by eating chorus fruit.'
  keep-inventory: 'Keeps inventory and XP on death inside the region.'
  exp-drop: 'Removes the XP orbs from deaths inside the region.'
  chat: 'Prevents players chatting while inside the region.'
  elytra: 'Prevents players starting to glide with an elytra inside.'
  fly: 'Prevents survival or adventure players starting to fly inside.'
  totem: 'Prevents totems of undying from saving players inside.'
  command-blacklist: 'Comma-separated list of command names blocked inside the region.'
  ride: 'Prevents mounting vehicles and rideable entities.'
  sleep: 'Prevents sleeping in a bed.'
  respawn-anchor: 'Prevents charging or using respawn anchors.'
  item-frame-rotation: 'Prevents rotating the item displayed in an item frame.'
  use-anvil: 'Prevents opening anvils.'
  beacon: 'Prevents opening beacons.'
  villager-trade: 'Prevents trading with villagers and wandering traders.'
  shear: 'Prevents shearing sheep, mooshrooms and snow golems.'
  leash: 'Prevents leashing entities with a lead.'
  animal-breeding: 'Prevents breeding animals.'
  sign-edit: 'Prevents editing sign text.'
  fishing-hook: 'Prevents reeling in entities or items with a fishing rod.'
  projectile-launch: 'Prevents firing projectiles like arrows, tridents and snowballs.'
  receive-chat: 'Prevents players inside the region from receiving chat messages.'
  command-whitelist: 'List of the only command roots allowed inside the region.'
  deny-message: 'Custom message shown instead of the generic denial message for refused actions.'
  entry-deny-message: 'Custom message shown when entry to the region is refused.'
  exit-deny-message: 'Custom message shown when leaving the region is refused.'
  farewell-title: 'Title line shown when a player leaves the region.'
  farewell-subtitle: 'Subtitle line shown when a player leaves the region.'
  lightning: 'Prevents lightning striking inside the region.'
  lava-fire: 'Prevents lava setting nearby blocks on fire.'
  water-flow: 'Prevents water flowing inside the region.'
  lava-flow: 'Prevents lava flowing inside the region.'
  fire-burn: 'Prevents fire consuming blocks.'
  block-spread: 'Prevents non-fire spreading like grass, mycelium, mushrooms, vines and sculk.'
