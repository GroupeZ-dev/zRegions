# zRegions - main configuration
# Documentation: https://docs.groupez.dev/zregions

# The language is picked in language.yml (loaded first, never translated):
# it selects the bundled defaults for config.yml, messages.yml and the menus.

# Enables verbose logging (useful when reporting an issue).
debug: false

# Permission nodes. Changing them takes effect on /rg reload.
permissions:
  # Players holding this permission bypass every region protection.
  bypass: zregions.bypass

messages:
  # Minimum delay (in milliseconds) between two "denied" messages sent to the
  # same player, so pushing against a border does not spam the chat.
  deny-throttle-milliseconds: 2000

# Region behaviour.
regions:
  # When true (default), /rg create adds the creator as the region's owner.
  # Set to false so new regions have no owner (admin-managed only, zregions.admin).
  creator-becomes-owner: true

# Selection tool.
selection:
  # Bukkit Material of the wand given by /rg wand (left click = pos1, right click = pos2).
  wand-item: BLAZE_ROD

# Border outline shown by /rg show (particles visible to that player only).
borders:
  # Bukkit particle used for the outline (FLAME, END_ROD, HAPPY_VILLAGER, ...).
  particle: FLAME
  # How long the outline stays visible, in seconds.
  display-seconds: 10
  # Refresh period of the particles, in milliseconds.
  refresh-milliseconds: 500
  # Distance between two particles along the edges, in blocks.
  point-spacing: 0.5
  # Hard cap on particles per refresh — huge regions get a sparser outline.
  max-points: 1500

# Multi-server (network) support. The messaging layer ships in v2, but the data
# model is network-ready from v1: every region is stamped with this server name.
multi-server:
  # Set to true when several servers share the same MySQL/MariaDB database.
  enabled: false
  # The logical name of THIS server on the network ("global" = single-server).
  server: global

# Region storage.
storage:
  # SQLITE (local file, default) or MYSQL / MARIADB (required for multi-server).
  type: SQLITE
  # Prefix applied to every zRegions table.
  table-prefix: zregions_
  # Credentials, only used for MYSQL / MARIADB.
  database:
    host: 127.0.0.1
    port: 3306
    database: zregions
    user: root
    password: ""
